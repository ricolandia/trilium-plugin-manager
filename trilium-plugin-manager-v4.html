<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  /* ── Variáveis: herda o tema do Trilium, com fallbacks ── */
  :root {
    --bg:       var(--main-background-color,   #16161e);
    --surface:  var(--accented-background-color, #1f1f2e);
    --border:   var(--main-border-color,         #2e2e42);
    --text:     var(--main-text-color,           #c0caf5);
    --muted:    var(--muted-text-color,          #565f89);
    --accent:   #7aa2f7;
    --green:    #9ece6a;
    --red:      #f7768e;
    --yellow:   #e0af68;
    --r:        8px;
    --mono:     'JetBrains Mono', 'Fira Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family, 'Segoe UI', system-ui, sans-serif);
    background: transparent;
    color: var(--text);
    padding: 20px 24px 40px;
    font-size: 14px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .header-left h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-left p {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 3px;
  }
  .btn-refresh {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-refresh:hover { color: var(--text); border-color: var(--accent); }

  /* ── Config banner ── */
  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--r);
    margin-bottom: 20px;
    font-size: 0.82rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: all 0.2s;
  }
  .banner.ok     { border-color: var(--green); color: var(--green); }
  .banner.warn   { border-color: var(--yellow); color: var(--yellow); }
  .banner.error  { border-color: var(--red);   color: var(--red); }
  .banner .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ── Grid de cards ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s, transform 0.1s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.is-installed { border-color: var(--green); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .card-version {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
    border: 1px solid var(--border);
  }
  .card-author {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .card-desc {
    font-size: 0.85rem;
    line-height: 1.55;
    color: var(--text);
    flex-grow: 1;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tag {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .badge-ok {
    font-size: 0.75rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ── Botões ── */
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover:not(:disabled) { opacity: 0.85; transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-install {
    background: var(--accent);
    color: #16161e;
  }
  .btn-reinstall {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.75rem;
  }
  .btn-reinstall:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Estados ── */
  .state-center {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .state-center .icon { font-size: 2rem; margin-bottom: 12px; }
  .state-center p { font-size: 0.85rem; line-height: 1.6; }
  .state-center code {
    font-family: var(--mono);
    background: var(--surface);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--yellow);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 18px; right: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 16px;
    font-size: 0.82rem;
    z-index: 9999;
    max-width: 280px;
    animation: toastIn 0.2s cubic-bezier(.22,1,.36,1);
  }
  .toast.ok    { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red);   color: var(--red); }
  @keyframes toastIn {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* ── Source pill (remote/local) ── */
  .source-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .source-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .source-pill.remote { border-color: var(--accent); color: var(--accent); }
  .source-pill.local  { border-color: var(--yellow); color: var(--yellow); }
  .source-pill.error  { border-color: var(--red);    color: var(--red); }
  .source-pill .icon-s { font-style: normal; }

  .badge-update {
    font-size: 0.75rem;
    color: var(--yellow);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-update {
    background: var(--yellow);
    color: #16161e;
    font-size: 0.82rem;
  }
  .card.has-update { border-color: var(--yellow); }

  .btn-uninstall {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--red);
    font-size: 0.75rem;
    padding: 6px 10px;
  }
  .btn-uninstall:hover { border-color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }

  /* ── Spinner inline ── */
  .spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>🧩 Plugin Manager</h1>
    <p>Gerencie plugins do TriliumNext</p>
  </div>
  <button class="btn-refresh" onclick="init()">↻ Atualizar</button>
</div>

<div id="banner" class="banner">
  <div class="dot"></div>
  <span>Inicializando...</span>
</div>

<div id="source-bar" class="source-bar" style="display:none">
  <span>Registry:</span>
  <span id="source-pill" class="source-pill"></span>
  <span id="source-ts"></span>
</div>

<div id="content">
  <div class="state-center"><div class="icon">⏳</div><p>Carregando registry...</p></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  CONFIG — atributos (labels) necessários no Trilium:
//
//  Na nota com #pluginRegistry:
//    #etapiToken    → token gerado em Options > ETAPI  (obrigatório)
//    #triliumPort   → porta do Trilium (padrão: 37840) (opcional)
//    #registryUrl   → URL remota do JSON do registry   (opcional)
//                     ex: https://gist.githubusercontent.com/user/id/raw/registry.json
//                     Se ausente, usa o conteúdo local da nota como fallback.
//
//  Notas com esses atributos:
//    #installedPlugins  → nota "Installed" (recebe os imports de ZIP)
//    #pluginRegistry    → nota com JSON local + labels de config
// ════════════════════════════════════════════════════════════════

let CFG = {};
let installedMap = new Map(); // pluginId → versão instalada

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  setBanner('Conectando ao backend...', '');
  setContent('<div class="state-center"><div class="icon">⏳</div><p>Carregando...</p></div>');
  document.getElementById('source-bar').style.display = 'none';

  try {
    const data = await parent.api.runOnBackend(async () => {
      const registryNotes  = await api.searchForNotes('#pluginRegistry');
      const installedNotes = await api.searchForNotes('#installedPlugins');

      if (!registryNotes.length)  throw new Error('Nota com #pluginRegistry não encontrada.');
      if (!installedNotes.length) throw new Error('Nota com #installedPlugins não encontrada.');

      const registryNote  = registryNotes[0];
      const installedNote = installedNotes[0];

      const etapiToken  = registryNote.getAttribute('label', 'etapiToken')?.value;
      const port        = parseInt(registryNote.getAttribute('label', 'triliumPort')?.value || '0') || 37840;
      const registryUrl = registryNote.getAttribute('label', 'registryUrl')?.value || null;

      // Plugins já instalados — retorna { id → version }
      const installedChildren = await installedNote.getChildNotes();
      const installedVersions = {};
      for (const n of installedChildren) {
        const id  = n.getAttribute('label', 'pluginId')?.value;
        const ver = n.getAttribute('label', 'pluginVersion')?.value || '0.0.0';
        if (id) installedVersions[id] = ver;
      }

      // ── Fetch do registry: remoto com fallback local ──────────
      let registryContent = null;
      let source          = 'local';    // 'remote' | 'local' | 'fallback'
      let fetchError      = null;
      let fetchedAt       = new Date().toISOString();

      if (registryUrl) {
        try {
          const resp = await fetch(registryUrl, {
            headers: { 'Cache-Control': 'no-cache' }   // sempre busca versão fresca
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          registryContent = await resp.text();
          source = 'remote';
        } catch (err) {
          fetchError = err.message;
          source = 'fallback';
          // cai no conteúdo local abaixo
        }
      }

      if (!registryContent) {
        registryContent = await registryNote.getContent();
        if (source !== 'fallback') source = 'local';
      }

      return {
        etapiToken,
        port,
        registryUrl,
        installedNoteId: installedNote.noteId,
        installedVersions,
        registry: registryContent,
        source,
        fetchError,
        fetchedAt
      };
    }, []);

    CFG = {
      etapiToken:      data.etapiToken,
      port:            data.port,
      installedNoteId: data.installedNoteId
    };
    installedMap = new Map(Object.entries(data.installedVersions));

    // Valida token
    if (!CFG.etapiToken) {
      setBanner('Atributo #etapiToken não encontrado. Gere um token em Options > ETAPI e adicione como label na nota com #pluginRegistry.', 'error');
      return;
    }

    // Parse plugins para contar updates antes do banner
    let plugins = [];
    try { plugins = JSON.parse(data.registry).plugins || []; }
    catch { setBanner('Erro ao parsear o JSON do registry.', 'error'); return; }

    const updateCount = plugins.filter(p =>
      installedMap.has(p.id) && semverGt(p.version, installedMap.get(p.id))
    ).length;

    const updateNote = updateCount > 0 ? ` · 🔔 ${updateCount} update(s) disponível(is)` : '';
    setBanner(
      `Conectado · porta ${CFG.port} · ${installedMap.size} plugin(s) instalado(s)${updateNote}`,
      updateCount > 0 ? 'warn' : 'ok'
    );

    setSourcePill(data.source, data.registryUrl, data.fetchedAt, data.fetchError);
    renderPlugins(plugins);

  } catch (err) {
    setBanner('Erro: ' + err.message, 'error');
    setContent('<div class="state-center"><div class="icon">⚠️</div><p>' + escHtml(err.message) + '</p></div>');
    console.error('[PluginManager]', err);
  }
}

// ── SOURCE PILL ──────────────────────────────────────────────────
function setSourcePill(source, url, fetchedAt, fetchError) {
  const bar  = document.getElementById('source-bar');
  const pill = document.getElementById('source-pill');
  const ts   = document.getElementById('source-ts');

  const labels = {
    remote:   { icon: '🌐', text: url ? shortenUrl(url) : 'remoto',    cls: 'remote' },
    local:    { icon: '📄', text: 'nota local',                         cls: 'local'  },
    fallback: { icon: '⚠', text: 'fallback local (fetch falhou)',       cls: 'error'  }
  };
  const cfg = labels[source] || labels.local;

  pill.className = `source-pill ${cfg.cls}`;
  pill.innerHTML = `<i class="icon-s">${cfg.icon}</i> ${escHtml(cfg.text)}`;

  const d = new Date(fetchedAt);
  const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  ts.textContent = `· atualizado às ${hm}` + (fetchError ? ` · erro: ${fetchError}` : '');

  bar.style.display = 'flex';
}

function shortenUrl(url) {
  try {
    const u = new URL(url);
    // mostra só host + início do path
    const path = u.pathname.length > 30 ? u.pathname.slice(0, 28) + '…' : u.pathname;
    return u.hostname + path;
  } catch { return url.slice(0, 40) + '…'; }
}

// ── RENDER ───────────────────────────────────────────────────────
function renderPlugins(plugins) {
  if (!plugins.length) {
    setContent(`<div class="state-center">
      <div class="icon">📭</div>
      <p>Nenhum plugin no registry.<br>
      Edite a nota com <code>#pluginRegistry</code> para adicionar plugins.</p>
    </div>`);
    return;
  }
  setContent('<div class="grid">' + plugins.map(p => cardHTML(p)).join('') + '</div>');
}

function cardHTML(p) {
  const installedVer = installedMap.get(p.id);
  const isInstalled  = installedVer !== undefined;
  const hasUpdate    = isInstalled && semverGt(p.version, installedVer);

  const tagsHtml = (p.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

  let cardClass  = 'card';
  let footerHtml = '';

  if (!isInstalled) {
    cardClass  = 'card';
    footerHtml = `<span></span>
      <button id="btn-${p.id}" class="btn btn-install" onclick='installPlugin(${safeJson(p)})'>Instalar</button>`;
  } else if (hasUpdate) {
    cardClass  = 'card has-update';
    footerHtml = `<span class="badge-update">↑ v${escHtml(installedVer)} → v${escHtml(p.version)}</span>
      <div style="display:flex;gap:6px">
        <button id="btn-${p.id}" class="btn btn-update" onclick='installPlugin(${safeJson(p)})'>Atualizar</button>
        <button id="del-${p.id}" class="btn btn-uninstall" onclick='uninstallPlugin(${safeJson(p)})'>✕</button>
      </div>`;
  } else {
    cardClass  = 'card is-installed';
    footerHtml = `<span class="badge-ok">✓ v${escHtml(installedVer)}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-reinstall" onclick='installPlugin(${safeJson(p)})'>↺</button>
        <button id="del-${p.id}" class="btn btn-uninstall" onclick='uninstallPlugin(${safeJson(p)})'>✕</button>
      </div>`;
  }

  return `
    <div class="${cardClass}" id="card-${p.id}">
      <div class="card-top">
        <div class="card-name">${escHtml(p.name)}</div>
        <div class="card-version">v${escHtml(p.version)}</div>
      </div>
      <div class="card-author">por ${escHtml(p.author || '—')}</div>
      <div class="card-desc">${escHtml(p.description || '')}</div>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      <div class="card-footer">${footerHtml}</div>
    </div>`;
}

// ── INSTALL ──────────────────────────────────────────────────────
async function installPlugin(p) {
  const btn = document.getElementById('btn-' + p.id);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Instalando...'; }

  try {
    const result = await parent.api.runOnBackend(async (zipUrl, parentNoteId, etapiToken, port) => {

      // 1. Baixa o ZIP
      const zipResp = await fetch(zipUrl);
      if (!zipResp.ok) throw new Error(`Falha ao baixar ZIP (HTTP ${zipResp.status})`);
      const arrayBuf = await zipResp.arrayBuffer();
      const zipBuf   = Buffer.from(arrayBuf);

      // 2. Monta multipart/form-data manualmente (sem dependências externas)
      const boundary = 'TriliumPlugin' + Date.now();
      const head = Buffer.from(
        `--${boundary}\r\n` +
        `Content-Disposition: form-data; name="file"; filename="plugin.zip"\r\n` +
        `Content-Type: application/zip\r\n\r\n`
      );
      const tail = Buffer.from(`\r\n--${boundary}--\r\n`);
      const body = Buffer.concat([head, zipBuf, tail]);

      // 3. POST para o endpoint de import via ETAPI
      const importResp = await new Promise((resolve, reject) => {
        const http = require('http');
        const req  = http.request({
          hostname: 'localhost',
          port,
          path:   `/etapi/notes/${parentNoteId}/import`,
          method: 'POST',
          headers: {
            'Authorization':  `Bearer ${etapiToken}`,
            'Content-Type':   `multipart/form-data; boundary=${boundary}`,
            'Content-Length': body.length
          }
        }, res => {
          let raw = '';
          res.on('data', c => raw += c);
          res.on('end', () => resolve({ status: res.statusCode, body: raw }));
        });
        req.on('error', reject);
        req.write(body);
        req.end();
      });

      if (importResp.status >= 400) {
        throw new Error(`Import falhou (${importResp.status}): ${importResp.body}`);
      }

      // 4. Aguarda criação e encontra a nota mais recente em Installed
      await new Promise(r => setTimeout(r, 600));
      const installedNote   = await api.getNote(parentNoteId);
      const children = await installedNote.getChildNotes();
      // ordena do mais novo para o mais antigo (noteId é crescente no SQLite)
      const newest   = children.sort((a, b) => b.noteId.localeCompare(a.noteId))[0];

      return { ok: true, noteId: newest?.noteId };

    }, [p.zipUrl, CFG.installedNoteId, CFG.etapiToken, CFG.port]);

    // 5. Marca a nota com metadados do plugin (via segunda chamada de backend)
    if (result.noteId) {
      await parent.api.runOnBackend(async (noteId, pluginId, pluginVersion, pluginName) => {
        const note = await api.getNote(noteId);
        if (!note) return;
        await note.setAttribute('label', 'pluginId',      pluginId);
        await note.setAttribute('label', 'pluginVersion', pluginVersion);
        await note.setAttribute('label', 'pluginName',    pluginName);
      }, [result.noteId, p.id, p.version, p.name]);
    }

    installedMap.set(p.id, p.version);
    showToast(`✓ ${p.name} v${p.version} instalado!`, 'ok');

    // Atualiza o card para estado "instalado"
    const card = document.getElementById('card-' + p.id);
    if (card) {
      card.className = 'card is-installed';
      card.querySelector('.card-footer').innerHTML =
        `<span class="badge-ok">✓ v${escHtml(p.version)}</span>
         <div style="display:flex;gap:6px">
           <button class="btn btn-reinstall" onclick='installPlugin(${safeJson(p)})'>↺</button>
           <button id="del-${p.id}" class="btn btn-uninstall" onclick='uninstallPlugin(${safeJson(p)})'>✕</button>
         </div>`;
    }

  } catch (err) {
    showToast(`✗ ${err.message}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Instalar'; }
    console.error('[PluginManager] install error:', err);
  }
}

// ── UNINSTALL ────────────────────────────────────────────────────
async function uninstallPlugin(p) {
  const btn = document.getElementById('del-' + p.id);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }

  try {
    await parent.api.runOnBackend(async (installedNoteId, pluginId) => {
      const installedNote   = await api.getNote(installedNoteId);
      const children = await installedNote.getChildNotes();
      const target   = children.find(n => n.getAttribute('label', 'pluginId')?.value === pluginId);
      if (!target) throw new Error(`Nota do plugin "${pluginId}" não encontrada em Installed.`);
      await target.delete();
    }, [CFG.installedNoteId, p.id]);

    installedMap.delete(p.id);
    showToast(`🗑 ${p.name} removido.`, 'ok');

    // Volta o card ao estado "não instalado"
    const card = document.getElementById('card-' + p.id);
    if (card) {
      card.className = 'card';
      card.querySelector('.card-footer').innerHTML =
        `<span></span>
         <button id="btn-${p.id}" class="btn btn-install" onclick='installPlugin(${safeJson(p)})'>Instalar</button>`;
    }

  } catch (err) {
    showToast(`✗ ${err.message}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✕'; }
    console.error('[PluginManager] uninstall error:', err);
  }
}

// ── UTILS ────────────────────────────────────────────────────────
// Retorna true se versão `a` é maior que `b` (comparação semver simples)
function semverGt(a, b) {
  const parse = v => String(v || '0').split('.').map(n => parseInt(n) || 0);
  const [a1, a2, a3] = parse(a);
  const [b1, b2, b3] = parse(b);
  if (a1 !== b1) return a1 > b1;
  if (a2 !== b2) return a2 > b2;
  return a3 > b3;
}

function setBanner(msg, type) {
  const el = document.getElementById('banner');
  el.className = 'banner ' + (type || '');
  el.innerHTML = `<div class="dot"></div><span>${escHtml(msg)}</span>`;
}

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function safeJson(obj) {
  // escapa aspas simples para uso seguro em onclick="..."
  return JSON.stringify(obj).replace(/'/g, '&#39;');
}

function showToast(msg, type) {
  const t = Object.assign(document.createElement('div'), {
    className: 'toast ' + type,
    textContent: msg
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// ── START ─────────────────────────────────────────────────────────
init();
</script>
